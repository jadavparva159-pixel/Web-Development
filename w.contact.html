<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Wireframe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    padding:20px;
}

.header,
.nav,
.main,
.footer{
    border:2px solid black;
    padding:20px;
    margin-bottom:20px;
}

.header,.footer{
    text-align:center;
}

.nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.form{
    width:60%;
    margin:20px auto;
    border:2px dashed black;
    padding:20px;
}

.box{
    border:2px solid black;
    height:40px;
    margin:10px 0 20px;
}

.message{
    border:2px solid black;
    height:120px;
    margin:10px 0 20px;
}

.button{
    width:180px;
    border:2px solid black;
    text-align:center;
    padding:10px;
    margin:auto;
}

</style>

</head>

<body>

<div class="header">
<h2>HEADER</h2>
StudentHub Portal<br>
Contact Us
</div>

<div class="nav">
<div>Home</div>
<div>About</div>
<div>Register</div>
<div>Login</div>
<div>Dashboard</div>
<div>Event</div>
<div>Profile</div>
<div>Contact</div>
<div>Admin</div>
<div>FAQ</div>
</div>

<div class="main">

<h2 style="text-align:center;">Contact Form</h2>

<div class="form">

<b>Full Name</b>
<div class="box"></div>

<b>Email</b>
<div class="box"></div>

<b>Message</b>
<div class="message"></div>

<div class="button">
Send Message
</div>

</div>

</div>

<div class="footer">
<h2>FOOTER</h2>
© 2026 StudentHub Portal
</div>

</body>
</html>
