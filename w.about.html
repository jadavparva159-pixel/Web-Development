<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Page Wireframe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    padding:20px;
}

.container{
    width:80%;
    margin:auto;
}

.box{
    border:2px solid black;
    background:white;
    text-align:center;
    padding:20px;
    margin-bottom:20px;
}

.nav{
    display:flex;
    justify-content:space-around;
    border:2px solid black;
    padding:15px;
    background:white;
    margin-bottom:20px;
}

.main{
    border:2px solid black;
    background:white;
    padding:20px;
}

.content{
    border:2px dashed gray;
    padding:20px;
    margin-top:15px;
}

.footer{
    border:2px solid black;
    background:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}

ul{
    margin-left:30px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="box">
        <h2>HEADER</h2>
        <p>StudentHub Portal</p>
        <p>About Us</p>
    </div>

    <!-- Navigation -->
    <div class="nav">
        <span>Home</span>
        <span>About</span>
        <span>Register</span>
        <span>Login</span>
        <span>Dashboard</span>
        <span>Contact</span>
    </div>

    <!-- Main Content -->
    <div class="main">

        <h3>MAIN CONTENT</h3>

        <div class="content">

            <h4>About StudentHub</h4>

            <br>

            <p>
                StudentHub Description Paragraph
            </p>

            <br>

            <h4>Objectives</h4>

            <ul>
                <li>Manage student records</li>
                <li>View attendance</li>
                <li>Check results</li>
                <li>Receive notices</li>
                <li>Access profile</li>
            </ul>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <h3>FOOTER</h3>
        <p>© 2026 StudentHub Portal</p>
    </div>

</div>

</body>
</html>
