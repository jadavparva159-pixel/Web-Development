<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Wireframe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:white;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
    border:2px solid black;
}

header{
    border-bottom:2px solid black;
    text-align:center;
    padding:20px;
}

nav{
    border-bottom:2px solid black;
    text-align:center;
    padding:15px;
}

nav span{
    margin:0 10px;
    font-weight:bold;
}

main{
    width:40%;
    margin:30px auto;
}

section{
    border:2px solid black;
    padding:25px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

.input-box{
    width:100%;
    height:40px;
    border:2px solid black;
    margin-top:8px;
    margin-bottom:15px;
}

.button{
    width:100%;
    height:45px;
    border:2px solid black;
    text-align:center;
    line-height:45px;
    font-weight:bold;
    margin-top:20px;
}

footer{
    border-top:2px solid black;
    text-align:center;
    padding:15px;
    margin-top:30px;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>STUDENTHUB PORTAL</h1>
<p>Student Login</p>

</header>

<nav>

<span>Home</span> |
<span>About</span> |
<span>Register</span> |
<span>Login</span> |
<span>Dashboard</span> |
<span>Events</span> |
<span>Profile</span> |
<span>Contact</span> |
<span>Admin</span> |
<span>FAQ</span>

</nav>

<main>

<section>

<h2>Login</h2>

<label>Email</label>
<div class="input-box"></div>

<label>Password</label>
<div class="input-box"></div>

<div class="button">
LOGIN
</div>

</section>

</main>

<footer>

© 2026 StudentHub Portal

</footer>

</div>

</body>
</html>
